services:
  - type: web
    name: science-phenomenons
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run catalog
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Khóa xem phản hồi tại /api/feedback?key=... (Render tự sinh, xem trong tab Environment)
      - key: ADMIN_KEY
        generateValue: true
      # Upstash là tùy chọn: thêm UPSTASH_REDIS_REST_URL và UPSTASH_REDIS_REST_TOKEN nếu muốn
      # phản hồi/thống kê không mất khi Render khởi động lại. Không có thì lưu file tạm trong var/.
