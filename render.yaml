services:
  # Static Site: không ngủ, mở nhanh. Build chỉ dùng module có sẵn của Node, không cần npm install.
  - type: web
    name: science-phenomenons
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /js/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
# Muốn có form góp ý thì đổi sang Web Service: runtime node, buildCommand "npm ci --omit=dev && npm run catalog",
# startCommand "npm start", healthCheckPath /healthz (xem README).
